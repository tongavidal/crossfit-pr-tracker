<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101114">

    <title>PR Tracker</title>

    <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>

    <!-- AUTHENTICATION -->
    <section class="auth-section" id="authSection">
        <div class="auth-card">

            <a href="#" class="logo">
                <span class="logo-icon">P</span>
                PR TRACKER
            </a>

            <div class="auth-heading">
                <p class="eyebrow">YOUR TRAINING JOURNEY</p>
                <h1 id="authTitle">Welcome back<span>.</span></h1>
                <p class="subtitle" id="authSubtitle">
                    Sign in to track your personal records.
                </p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="your@email.com"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="primary-button">
                    Sign in
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <button type="button" id="showSignupBtn">
                        Create account
                    </button>
                </p>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" hidden>
                <label for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="your@email.com"
                    autocomplete="email"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit" class="primary-button">
                    Create account
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <button type="button" id="showLoginBtn">
                        Sign in
                    </button>
                </p>
            </form>

            <p id="authMessage" class="auth-message" role="status"></p>

        </div>
    </section>


    <!-- MAIN APPLICATION -->
    <div class="app" id="app" hidden>

        <header class="header">
            <a href="#" class="logo">
                <span class="logo-icon">P</span>
                PR TRACKER
            </a>

            <div class="user-info">
                <span class="user-avatar">U</span>
                <span id="currentUserEmail">My account</span>
                <button id="logoutBtn" type="button">
                    Sign out
                </button>
            </div>
        </header>

        <main class="main">

            <section class="welcome">
                <div>
                    <h1>Personal Records</h1>
                    <p id="recordSummary" class="record-summary" role="status"></p>
                </div>
                <div class="log-action">
                    <button class="primary-button" id="addRecordBtn" type="button">+ Log a lift</button>
                </div>
            </section>

            <section class="records-section">
                <div class="section-header">
                    <h2>My exercises</h2>
                </div>

                <div class="records-grid" id="recordsGrid">
                    <!-- Personal records will be loaded from Supabase -->
                </div>

            </section>

            
            <!-- ADD RECORD DIALOG -->
            <dialog id="recordDialog" class="record-dialog" aria-labelledby="recordDialogTitle">
                <form id="recordForm" class="record-form">
            
                    <div class="section-header">
                        <h2 id="recordDialogTitle">Log a lift</h2>
                        <button type="button" id="closeRecordDialog" class="dialog-close" aria-label="Close">
                            ✕
                        </button>
                    </div>
            
                    <label for="exerciseSelect">Exercise</label>
                    <select id="exerciseSelect" required>
                        <option value="">Loading exercises...</option>
                    </select>
            
                    <label for="recordWeight">Weight (kg)</label>
                    <input
                        type="text"
                        id="recordWeight"
                        inputmode="decimal"
                        placeholder="e.g. 100"
                        required
                    >
            
                    <label for="recordDate">Date</label>
                    <input type="date" id="recordDate" required>
            
                    <details class="record-notes">
                        <summary>Notes (optional)</summary>
                        <textarea id="recordNotes" aria-label="Notes (optional)" rows="3"></textarea>
                    </details>
            
                    <p id="recordMessage" class="auth-message" role="status"></p>
            
                    <div class="record-form-actions">
                        <button type="button" id="cancelRecordBtn" class="secondary-button">
                            Cancel
                        </button>
                        <button type="submit" class="primary-button" id="saveRecordBtn">
                            Save record
                        </button>
                    </div>
            
                </form>
            </dialog>


        </main>

    </div>

    <script type="module" src="js/app.js?v=4"></script>

</body>
</html>
